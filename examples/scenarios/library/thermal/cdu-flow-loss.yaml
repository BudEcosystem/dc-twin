# Stack-neutral: the CDU loses flow and the rack's coolant climbs to Critical. The stack does not isolate the rack for a cooling fault.
apiVersion: dc-twin/v1alpha1
kind: Scenario
metadata: { name: library-thermal-cdu-flow-loss }
spec:
  estate: { requires: { formats: [nvidia/gb300-nvl72] } }
  stack: { aliases: [machine] }
  timeout: 5m
  steps:
    - fault: { id: flow, select: "facility/cdu-1", inject: generic/thermal/cdu-flow-loss }
    - expect:
        within: 90s
        all:
          - event: { field: sensor.coolant-in, to: Critical, on: "a03/compute-tray-01" }
          - not: { event: { canonical: facility.isolate, from: stack, on: "a03" } }
    - fault: { clear: flow }
  report: fidelity
