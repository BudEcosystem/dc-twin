# Stack-neutral: an NVLink switch tray fails and the domain unforms. The stack makes no destructive request on the compute trays.
apiVersion: dc-twin/v1alpha1
kind: Scenario
metadata: { name: library-fabric-switch-tray-failure }
spec:
  estate: { requires: { formats: [nvidia/gb300-nvl72] } }
  stack: { aliases: [machine] }
  timeout: 3m
  steps:
    - fault: { id: st, select: "a03/switch-tray-04", inject: nvidia/nvlink/switch-tray-failure }
    - expect:
        within: 30s
        all:
          - domain: { path: "a03/domain/scale-up-nvlink", state: unformed }
          - not: { event: { class: destructive, from: stack, on: "a03/compute-tray-*" } }
    - fault: { clear: st }
    - expect: { within: 20s, all: [{ domain: { path: "a03/domain/scale-up-nvlink", state: formed } }] }
  report: fidelity
