# Stack-neutral: a BMS rack leak point; the stack raises an alert that blocks allocation and powers nothing off.
apiVersion: dc-twin/v1alpha1
kind: Scenario
metadata: { name: library-leak-rack-point }
spec:
  estate: { requires: { formats: [nvidia/gb300-nvl72], capabilities: ["facility/bms:nvidia/dsx-exchange"] } }
  stack: { aliases: [alerts] }
  timeout: 3m
  steps:
    - fault: { id: rack, select: "a03/leak-point-01", inject: generic/leak/rack-point }
    - expect:
        within: 30s
        all:
          - accessor: { alias: alerts, args: { rack: a03 }, equals: { kind: RackLeak, preventAllocations: true } }
          - not: { event: { class: destructive, from: stack, on: "a03/**" } }
    - fault: { clear: rack }
  report: fidelity
