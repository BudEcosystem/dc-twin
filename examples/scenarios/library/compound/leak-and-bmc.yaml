# Stack-neutral: two faults at once, a BMC lost on one tray and a leak on another. The stack takes the leaking tray down and nothing else.
apiVersion: dc-twin/v1alpha1
kind: Scenario
metadata: { name: library-compound-leak-and-bmc }
spec:
  estate: { requires: { formats: [nvidia/gb300-nvl72], capabilities: [redfish/leak-detectors] } }
  stack: { aliases: [machine] }
  timeout: 6m
  steps:
    - wait: { for: 'model.select("a03/compute-tray-*").all(d, accessors.machine(d.identity.serial).state == "Ready")', within: 3m }
    - fault: { id: dead, select: "a03/compute-tray-03", inject: generic/bmc/unreachable }
    - fault: { id: leak, select: "a03/compute-tray-09", inject: generic/leak/tray-detector }
    - expect:
        within: 45s
        all:
          - model: { expr: 'model.device("a03/compute-tray-09").power == "Off"' }
          - not: { event: { class: destructive, from: stack, on: "a03/compute-tray-{01..08}" } }
          - not: { event: { class: destructive, from: stack, on: "a03/compute-tray-{10..18}" } }
    - fault: { clear: leak }
    - fault: { clear: dead }
  report: fidelity
