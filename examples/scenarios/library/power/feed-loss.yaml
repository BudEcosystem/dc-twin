# Stack-neutral: feed A is lost and the NVL72 busbar drops its trays. The stack has nothing to repair; it makes no destructive request. A technician powers the rack back on.
apiVersion: dc-twin/v1alpha1
kind: Scenario
metadata: { name: library-power-feed-loss }
spec:
  estate: { requires: { formats: [nvidia/gb300-nvl72] } }
  stack: { aliases: [machine] }
  timeout: 5m
  steps:
    - act: { feed: A, up: false }
    - expect:
        within: 30s
        all:
          - event: { field: ac, to: false, on: "a03/compute-tray-01" }
          - not: { event: { class: destructive, from: stack, on: "a03/**" } }
    - act: { feed: A, up: true }
    - expect: { within: 30s, all: [{ event: { field: bmc, to: Enabled, on: "a03/compute-tray-01" } }] }
    - act: { power: On, select: "a03/switch-tray-*" }
    - act: { power: On, select: "a03/compute-tray-*" }
    - expect: { within: 60s, all: [{ domain: { path: "a03/domain/scale-up-nvlink", state: formed } }] }
  report: fidelity
