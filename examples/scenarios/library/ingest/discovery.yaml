# Stack-neutral: the stack discovers every BMC of an NVL72 rack and says each machine is Ready.
apiVersion: dc-twin/v1alpha1
kind: Scenario
metadata: { name: library-ingest-discovery }
spec:
  estate: { requires: { formats: [nvidia/gb300-nvl72] } }
  stack: { aliases: [machine] }
  timeout: 6m
  steps:
    - wait:
        for: 'model.select("a03/** ?class=compute-tray ?class=switch-tray ?class=power-shelf").all(d, accessors.machine(d.identity.serial).state == "Ready")'
        within: 4m
    - expect:
        within: 10s
        all:
          - dhcp: { select: "a03/** ?class=compute-tray ?class=switch-tray ?class=power-shelf", leased: true }
          - model: { expr: 'events.count({"kind": "request", "from": "stack", "canonical": "inventory.read"}) > 0' }
  report: fidelity
