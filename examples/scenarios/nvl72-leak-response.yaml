# A leak in an NVL72 rack, both ways a lifecycle manager sees one (docs/stacks/nvidia-dsx-os.md —
# The two leak paths). Path 1: a tray's own detector over Redfish; the stack shuts that tray down
# and no other. Path 2: a BMS rack leak point over DSX Exchange; the stack raises an alert that
# blocks allocation and powers nothing off. The stack is read only through the accessor aliases,
# so the same file runs against NICo (machine: nico.machine) or the reference stack.
apiVersion: dc-twin/v1alpha1
kind: Scenario
metadata: { name: nvl72-leak-response }
spec:
  estate:
    requires:
      formats: [nvidia/gb300-nvl72]
      capabilities: [redfish/leak-detectors, "facility/bms:nvidia/dsx-exchange"]
  stack:
    components: [refstack]
    accessors: { machine: refstack.machine, alerts: refstack.alerts }
  timeout: 10m
  steps:
    - wait:
        for: 'model.select("a03/compute-tray-*").all(d, accessors.machine(d.identity.serial).state == "Ready")'
        within: 3m

    # Path 1 — the tray's own leak detector.
    - fault: { id: tray, select: "a03/compute-tray-07", inject: generic/leak/tray-detector }
    - expect:
        within: 45s
        all:
          - redfish: { select: "a03/compute-tray-07", property: "Chassis/*/ThermalSubsystem/LeakDetection/LeakDetectors/*/DetectorState", equals: Critical }
          - event:   { canonical: power.off.graceful, from: stack, on: "a03/compute-tray-07" }
          - redfish: { select: "a03/compute-tray-07", property: "Systems/System_0/PowerState", equals: "Off" }
          - accessor: { alias: machine, args: { id: "{serial:a03/compute-tray-07}" }, equals: { leak_status: Leaking, leak_handling_status: Down } }
          - not: { event: { canonical: power.off.graceful, on: "a03/compute-tray-{01..06}" } }
          - not: { event: { canonical: power.off.graceful, on: "a03/compute-tray-{08..18}" } }

    # Path 2 — a BMS rack leak point.
    - fault: { id: rack, select: "a03/leak-point-01", inject: generic/leak/rack-point }
    - expect:
        within: 30s
        all:
          - bms:      { topic: "BMS/v1/PUB/Value/Rack/RackLeakDetect/#", value: true }
          - accessor: { alias: alerts, args: { rack: a03 }, equals: { kind: RackLeak, preventAllocations: true } }
          - not: { event: { canonical: power.off.graceful, from: stack, on: "a03/compute-tray-*" } }
          - not: { event: { canonical: power.off.force, from: stack, on: "a03/**" } }

    - fault: { clear: tray }
    - fault: { clear: rack }
    - expect:
        within: 30s
        all:
          - bms: { topic: "BMS/v1/PUB/Value/Rack/RackLeakDetect/#", value: false }
  report: fidelity
