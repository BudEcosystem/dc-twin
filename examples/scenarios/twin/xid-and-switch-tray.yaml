# An Xid 79 shows as Critical on the GPU's Redfish resources and the tray's health, degrades the
# NVLink domain, writes a SEL entry, survives a reboot and clears on an AC cycle. A failed NVLink
# switch tray unforms the domain.
apiVersion: dc-twin/v1alpha1
kind: Scenario
metadata: { name: xid-and-switch-tray }
spec:
  estate: { requires: { formats: [nvidia/gb300-nvl72] } }
  stack: {}
  timeout: 5m
  steps:
    - fault: { id: x79, select: "a01/compute-tray-07/gpu-2", inject: nvidia/xid/xid-79 }
    - expect:
        within: 5s
        all:
          - redfish: { select: "a01/compute-tray-07", property: "Systems/HGX_Baseboard_0/Processors/GPU_2/Status.Health", equals: Critical }
          - redfish: { select: "a01/compute-tray-07", property: "Systems/System_0/Status.Health", equals: Critical }
          - domain:  { path: "a01/domain/scale-up-nvlink", state: degraded }
          - model:   { expr: 'model.device("a01/compute-tray-07").health == "Critical"' }
    - act: { power: ForceRestart, select: "a01/compute-tray-07" }
    - act: { seconds: 4 }
    - expect: { within: 2s, all: [{ faults: { select: "a01/compute-tray-07/**", count: 1 } }] }
    - act: { power: ACCycle, select: "a01/compute-tray-07" }
    - expect:
        within: 20s
        all:
          - faults: { select: "a01/compute-tray-07/**", count: 0 }
          - event:  { field: health, to: OK, on: "a01/compute-tray-07" }
    - fault: { id: st, select: "a01/switch-tray-04", inject: nvidia/nvlink/switch-tray-failure }
    - expect: { within: 5s, all: [{ domain: { path: "a01/domain/scale-up-nvlink", state: unformed } }] }
    - fault: { clear: st }
    - expect: { within: 10s, all: [{ domain: { path: "a01/domain/scale-up-nvlink", state: formed } }] }
  report: fidelity
