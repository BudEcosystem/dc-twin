# The stack discovers every BMC of an NVL72 rack through relayed DHCP, identifies each as the
# hardware type it is from its Redfish identity strings, and reads its inventory (the
# `bmc-discovery` conformance scenario of docs/stacks/nvidia-dsx-os.md, at model fidelity).
apiVersion: dc-twin/v1alpha1
kind: Scenario
metadata: { name: bmc-discovery }
spec:
  estate: { requires: { formats: [nvidia/gb300-nvl72], capabilities: ["dhcp/relay-option-82"] } }
  stack:
    components: [refstack]
    accessors: { machine: refstack.machine }
  timeout: 10m
  steps:
    - wait:
        for: 'model.select("a03/** ?class=compute-tray ?class=switch-tray ?class=dpu ?class=power-shelf").all(d, accessors.machine(d.identity.serial).state == "Ready")'
        within: 3m
    - expect:
        within: 5s
        all:
          - dhcp: { select: "a03/** ?class=compute-tray ?class=switch-tray ?class=dpu ?class=power-shelf", leased: true }
          - model: { expr: 'model.select("a03/compute-tray-*").all(d, accessors.machine(d.identity.serial).hardware_type == "gb300-tray")' }
          - model: { expr: 'model.select("a03/switch-tray-*").all(d, accessors.machine(d.identity.serial).hardware_type == "nvswitch-tray")' }
          - model: { expr: 'model.select("a03/power-shelf-*").all(d, accessors.machine(d.identity.serial).hardware_type == "liteon-powershelf")' }
          - model: { expr: 'model.select("a03/compute-tray-01").all(d, accessors.machine(d.identity.serial).circuit_id.startsWith("a03-mgmt-switch-"))' }
          - model: { expr: 'events.count({"kind": "request", "from": "stack", "canonical": "inventory.read"}) > 100' }
  report: fidelity
