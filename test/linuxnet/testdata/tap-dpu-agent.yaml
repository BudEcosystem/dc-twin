# The TAP substrate with BlueFields whose HBN is emulated (D71): two racks of x86 servers with one
# BlueField-3 each (nvidia/dpu-host-1u), the servers at vm fidelity with the twin's own OS (os:
# twin), their BlueFields at model; a clos-2tier frontend fabric of generic/nvue-frr (one leaf per
# rack, one spine in the network rack). With spec.adapters.network.hbn each BlueField is a
# container of its own running the twin's NVUE over FRR with HBN's interface names: its p0 and p1
# are p0_if and p1_if, cabled to its rack's leaf as routed, unnumbered eBGP ports carrying EVPN; its
# host's NIC is its host PF, spliced onto pf0hpf_if, so the host's traffic crosses it. Rack r01 has
# two servers (one leaf, two DPUs), r02 one. The probe namespace is attached to the spine.
# NICo's own DPU agent and DHCP server, built from its source (compat/nico/hbn-build.sh), are
# mounted in each BlueField from HBN_BINARIES. r02 has a second server whose OS is the stack's:
# its firmware boots from the network, through its DPU. test/linuxnet substitutes HBN_BINARIES and the probe
# namespace's name.
apiVersion: dc-twin/v1alpha1
kind: Estate
metadata:
  name: linuxnet-dpu-agent
spec:
  seed: 2072
  clock: wall
  timeScale: 0.05
  packs: [generic@0.1.0, nvidia@0.1.0]
  fidelity:
    default: model
    overrides:
      - { select: "r01/server-0{1,2}", level: vm, os: twin }
      - { select: "r02/server-01", level: vm, os: twin }
      # its OS the stack's: it boots its firmware from the network, through its DPU
      - { select: "r02/server-02", level: vm, os: stack }
      - { select: "r0{1,2}/server-0{1,2}/bf3-0", level: model }
  sites:
    - name: site-1
      halls:
        - name: hall-a
          rows:
            - name: a
              positions: 4
              racks:
                - { name: r01, position: 1, format: generic/cpu-rack, params: { servers: 2, server: nvidia/dpu-host-1u }, feeds: [A, B] }
                - { name: r02, position: 2, format: generic/cpu-rack, params: { servers: 2, server: nvidia/dpu-host-1u }, feeds: [A, B] }
                - { name: n01, position: 4, format: generic/network-rack, feeds: [A, B] }
  networks:
    oob:          { role: management,   dhcp: twin, cidr: 10.30.0.0/20, fabric: oob }
    provisioning: { role: provisioning, dhcp: none, cidr: 10.40.0.0/20, fabric: frontend }
    frontend:     { role: frontend,     dhcp: none, cidr: 10.50.0.0/20, fabric: frontend }
  fabrics:
    - { name: oob,      template: oob-flat,   nos: none }
    - { name: frontend, template: clos-2tier, nos: generic/nvue-frr, params: { leafsPerRack: 1, spines: 1 }, placeIn: n01 }
  facility:
    power:
      feeds: [{ name: A, capacityW: 200000 }, { name: B, capacityW: 200000 }]
  adapters:
    vm: { memoryMB: 512, cpus: 1 }
    network:
      substrate: tap
      hbn: true
      nos: { hbnBinaries: HBN_BINARIES }
      attach:
        - { netns: PROBE_NETNS, port: "spine-1:eth63", address: 10.90.1.10/24, gateway: 10.90.1.1, interface: probe0 }
