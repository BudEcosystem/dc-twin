# dc-twin, generic/nvue-frr (18 — ZTP, D74): the DHCP client of a Cumulus Linux switch's management
# port, eth0, as docs/reviews/2026-11-11-day0-vendor-facts.md A.2 has it from Cumulus's ZTP page
# (5.14): option 239, cumulus-provision-url, a text option, carries the ZTP script's URL; the switch
# sends vendor class (option 60) "cumulus-linux  x86_64", with the two spaces the page says it has
# (the facts' reading; a switch's own dhclient.conf is not published, and which options it asks for
# beyond 239 is UNCONFIRMED: Debian's defaults are asked for here). The architecture is the
# switch's as the model has it, a Spectrum's x86_64, whatever the host the twin runs on.
option rfc3442-classless-static-routes code 121 = array of unsigned integer 8;
option cumulus-provision-url code 239 = text;

send host-name = gethostname();
send vendor-class-identifier "cumulus-linux  x86_64";
request subnet-mask, broadcast-address, time-offset, routers,
	domain-name, domain-name-servers, domain-search, host-name,
	dhcp6.name-servers, dhcp6.domain-search, dhcp6.fqdn, dhcp6.sntp-servers,
	netbios-name-servers, netbios-scope, interface-mtu,
	rfc3442-classless-static-routes, ntp-servers, cumulus-provision-url;
