# One BMC's credentials, as an operator stores them for Rufio (`authSecretRef`). run.sh fills the
# @...@ fields from `dctwin credentials`; the rendered copy lives only under $WORK.
apiVersion: v1
kind: Secret
metadata:
  name: @SECRET@
  namespace: dctwin
type: kubernetes.io/basic-auth
stringData:
  username: "@USERNAME@"
  password: "@PASSWORD@"
