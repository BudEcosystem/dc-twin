# NATS as NVCM 1.4.1's chart configures it (deploy/helm/templates/_nats-configmap-data.tpl): one
# account with JetStream, users for the system, NVCM's services and Nautobot's event broker
port: 4222
http_port: 8222
max_payload: 8388608
jetstream {
  store_dir: /data/jetstream
  max_mem: 128M
  max_file: 512M
}
accounts {
  main {
    jetstream: enabled
    users: [
      { user: sys, password: $SYS_PASSWORD }
      { user: nv-config-manager, password: $NV_CONFIG_MANAGER_PASSWORD }
      { user: nautobot, password: $NAUTOBOT_PASSWORD }
    ]
  }
}
