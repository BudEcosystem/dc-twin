# Nautobot's nginx, as NVCM 1.4.1's chart runs it beside uWSGI (deploy/helm/templates/nautobot.yaml):
# NVCM's services reach Nautobot here, on 8080, with HTTP keep-alive, which uWSGI's http-socket
# does not keep (a client reusing a connection finds it closed)
upstream nautobot {
  server 127.0.0.1:8003;
}
server {
  listen 8080;
  server_name _;
  location /static/ {
    alias /opt/nautobot/static/;
  }
  location / {
    proxy_pass http://nautobot;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1200;
    proxy_connect_timeout 300;
  }
  location /health {
    proxy_pass http://nautobot/health/;
    proxy_set_header Host $http_host;
  }
}
