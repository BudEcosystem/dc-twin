# Grove's portable topology (docs/user-guide/topology-aware-scheduling.md) bound to the labels the
# twin's Node projection carries: the hall (zone), the NVLink domain (GPU Feature Discovery's
# nvidia.com/gpu.clique, "<ClusterUUID>.<CliqueID>") and the node. Grove's KAI backend turns it into
# a KAI Topology of the same name (SyncTopology), which KAI's topology plugin places gangs in.
apiVersion: grove.io/v1alpha1
kind: ClusterTopologyBinding
metadata:
  name: nvlink
spec:
  levels:
    - domain: zone
      key: topology.kubernetes.io/zone
    - domain: nvlink-domain
      key: nvidia.com/gpu.clique
    - domain: host
      key: kubernetes.io/hostname
