{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dc-twin.serviceAccountName" . }}
  labels:
    {{- include "dc-twin.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# the twin calls no Kubernetes API (the kwok adapter uses the kubeconfig a stack's outputs name)
automountServiceAccountToken: false
{{- end }}
