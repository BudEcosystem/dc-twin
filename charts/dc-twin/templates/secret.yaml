{{- if not .Values.control.token.existingSecret }}
{{- $name := include "dc-twin.tokenSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dc-twin.labels" . | nindent 4 }}
type: Opaque
data:
  # made at install, kept across upgrades: a bookmarked console address keeps working
  token: {{ if and $old $old.data (index $old.data "token") }}{{ index $old.data "token" }}{{ else }}{{ randAlphaNum 40 | b64enc }}{{ end }}
{{- end }}
