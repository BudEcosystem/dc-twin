# dc-twin: one release runs one estate, in one pod. On the loopback substrate (D34, the default)
# every device endpoint is a port on the pod's loopback, and software under test reaches the
# devices through the site gateway. On the tap substrate (D82) the pod is privileged and runs real
# switch operating systems in a container engine beside the twin, as day 0 (18) needs.

image:
  repository: registry.bud.studio/gpu-foundry/dc-twin
  tag: ""  # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
# the registry's project is private: a secret for an account that can read it (README: Install)
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The estate the twin runs: the first of these that is set.
estate:
  # a ConfigMap of yours that holds the estate file under `key`
  existingConfigMap: ""
  key: estate.yaml
  # the estate file itself, e.g. --set-file estate.file=my-hall.yaml
  file: ""
  # an estate shipped in the image: examples/estates/<example>.yaml
  example: mixed-hall

# The adapters to run (dctwin up --adapters), e.g. [redfish, bms]. Empty runs every adapter.
adapters: []
# Serve the console beside the control API.
console: true

# The control API and the console.
control:
  port: 8765
  # The estate token. The chart makes one at install and keeps it across upgrades, in the Secret
  # <fullname>-token, unless you name a Secret of yours that holds it under `key` (do, with a tool
  # that renders the chart offline, such as Argo CD: it cannot look up the one already made).
  token:
    existingSecret: ""
    key: token
  # With neither this Service nor the Ingress below, the control API and the console listen on the
  # pod's loopback only (spec 15): reach them with kubectl port-forward. Either one makes the twin
  # listen on the pod's address too (--allow-remote-control, D54), with the token as the only
  # authentication: whoever has it can inject faults, power devices off and apply a changed estate.
  service:
    enabled: false
    type: ClusterIP
    port: 8765
    annotations: {}

# The console and the control API at a URL. The token is its only authentication, so serve it over
# TLS, and put a login or an allow-list in front where more than a trusted team can reach it.
ingress:
  enabled: false
  className: ""
  annotations: {}
    # ingress-nginx, a login in front through oauth2-proxy:
    # nginx.ingress.kubernetes.io/auth-url: https://oauth2.example.com/oauth2/auth
    # nginx.ingress.kubernetes.io/auth-signin: https://oauth2.example.com/oauth2/start?rd=$escaped_request_uri
    # or an allow-list:
    # nginx.ingress.kubernetes.io/whitelist-source-range: 10.0.0.0/8
    # Traefik, HTTPS only (plain HTTP unrouted):
    # traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: dc-twin.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: dc-twin-tls
    #   hosts: [dc-twin.example.com]

# A NetworkPolicy for the pod: the site gateway open to the cluster, the control port (when the
# Service or the Ingress serves it) only from the peers named here, such as the Ingress
# controller's pods, so the software under test cannot reach it.
networkPolicy:
  enabled: false
  controlFrom: []
    # - namespaceSelector:
    #     matchLabels: { kubernetes.io/metadata.name: ingress-nginx }

# The network substrate: loopback (D34), unprivileged; or tap (D82), for an estate whose fabrics
# run a real nos or are brought up by the software under test (fabric.bringUp: factory), with
# spec.adapters.network.substrate: tap. tap makes the pod privileged: its twin and its engine run
# as root, with the node's kernel, so give it a node you would give a container host.
substrate: loopback
tap:
  # The container engine the switches run in: Podman's Docker-compatible API, in a sidecar that
  # shares the pod's process namespace, so the twin can open each switch's network namespace.
  engine:
    image:
      repository: quay.io/podman/stable
      tag: v5.2.2
      pullPolicy: IfNotPresent
    resources: {}
    # The engine's image store: the switch images (about 1 GB for generic/nvue-frr) are pulled once.
    persistence:
      enabled: true
      existingClaim: ""
      storageClass: ""
      accessModes: [ReadWriteOnce]
      size: 20Gi
  # Where the engine pulls the twin's own switch images from (DCTWIN_REGISTRY), and the
  # kubernetes.io/dockerconfigjson Secret it logs in with; "" uses the first of imagePullSecrets.
  registry: registry.bud.studio/gpu-foundry
  registryAuthSecret: ""
  # The site's day-0 tooling (18): containers the engine starts, in this order, before the twin.
  # The estate's spec.adapters.network.attach cables one to a switch port by its `container` name
  # when the twin comes up, as the site's DHCP and ZTP servers are on its management network.
  # (An attach by `netns` is not supported here.) Each container:
  #   network  none (the default): only what the twin attaches; an engine network (tap.networks),
  #            with podman's options ("nvcm-net:interface_name=eth1" leaves eth0 to the twin);
  #            "container:<name>" to share an earlier container's network namespace; "podman",
  #            the engine's default bridge, which reaches the cluster through the pod
  #   mounts   "<file set>[/<path>]:<container path>[:ro]", a file of tap.files or a whole set
  #   options  more `podman run` flags: --cap-add, --sysctl, --hostname, -v <volume>:<path> (a
  #            named volume lives in the engine's store, so it survives the pod)
  # A container the twin attached loses its port if it restarts: the twin attaches at `up` only.
  containers: []
    # NVIDIA Config Manager's edge, as compat/nvcm/nvcm.sh runs it: Kea on its backend's network as
    # eth1, the twin's management network as eth0, and its DHCP API, configuration sync, ZTP API
    # and SFTP in its network namespace
    # - name: nvcm-edge
    #   image: registry.bud.studio/gpu-foundry/nvcm-kea:1.4.1
    #   network: "nvcm-net:interface_name=eth1"
    #   mounts: ["nvcm/nv-config-manager.ini:/etc/vault/nv-config-manager.ini:ro"]
    #   options: [--hostname, nvcm-edge, --cap-add, NET_RAW, --cap-add, NET_BIND_SERVICE,
    #             --sysctl, net.ipv4.ip_unprivileged_port_start=0]
    # - name: nvcm-ztp
    #   image: registry.bud.studio/gpu-foundry/nvcm-app:1.4.1
    #   network: "container:nvcm-edge"
    #   env: { NV_CONFIG_MANAGER_INI: /etc/nv-config-manager/nv-config-manager.ini, NV_CONFIG_MANAGER_REJECT_IDENTITY_HEADERS: "true" }
    #   mounts: ["nvcm/nv-config-manager.ini:/etc/nv-config-manager/nv-config-manager.ini:ro"]
    #   args: [nv-config-manager-ztp-api, --port, "80"]
  # Engine networks the containers join by name, made if missing.
  networks: []
    # - nvcm-net
  # Files the containers mount: each a Secret or ConfigMap of yours, as a file set by `name`.
  files: []
    # - { name: nvcm, secret: nvcm-config }

# Accept vm guests of another architecture under TCG (dctwin up --allow-tcg).
allowTCG: false
# More arguments for dctwin up.
extraArgs: []
extraEnv: []

# The site gateway: an HTTP CONNECT proxy through which software under test reaches each device at
# its site address (https://10.30.0.11) or host name, and nothing else.
gateway:
  port: 3128
  service:
    type: ClusterIP
    port: 3128
    nodePort: null  # with type NodePort
    annotations: {}

# The captured device trees, NVIDIA's NMX-C interface definition and the os: twin guest image
# (about 360 MB). They are not in the image (D13), so an init container runs `dctwin assets
# fetch`, which needs egress to github.com, codeload.github.com, raw.githubusercontent.com and
# dl-cdn.alpinelinux.org. It skips what is already present, so a persistent volume fetches once.
assets:
  fetch: true
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""  # "" uses the cluster's default
    accessModes: [ReadWriteOnce]
    size: 1Gi
    annotations: {}

# The state directory (the event log, control.json, an apply's <estate>.applied.yaml) is an
# emptyDir: a new pod is a new twin, started from the chart's estate. Export a design you want to
# keep and put it in estate.file.
state:
  sizeLimit: 2Gi

# About 140 MiB for the 354 devices of mixed-hall at idle; it grows with the estate.
resources:
  requests:
    cpu: 100m
    memory: 256Mi

# Each probe runs `dctwin status` in the container.
startupProbe:
  periodSeconds: 2
  timeoutSeconds: 5
  failureThreshold: 150
readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
livenessProbe:
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
