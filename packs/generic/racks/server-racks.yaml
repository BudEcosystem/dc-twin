apiVersion: dc-twin/v1alpha1
kind: RackFormat
metadata: { name: generic/hgx-8gpu, version: 0.1.0 }
spec:
  archetype: server-scale
  params:
    server:  { type: profile, class: server, default: oem-supermicro/sys-821ge-tnhr, label: Server }
    servers: { type: int, default: 4, range: [1, 4], label: Servers }
    pdu:     { type: profile, class: pdu, default: generic/pdu-3ph-24, label: PDU }
  slots:
    - { names: "pdu-{a,b}", profile: $pdu, side: zero-u }
    - { names: "mgmt-switch", profile: generic/mgmt-switch-1g }
    - { names: "server-{01..$servers}", profile: $server, accepts: { class: server, mounting: rack } }
  layout:
    height: 48
    uNumbering: eia
    front:
      - { slots: "mgmt-switch" }
      - { slots: "server-{01..04}" }
    back: [management, scale-out, frontend, power]
    reserved: [{ u: 1, units: 4, for: fabric }]
  power:
    inputs: [{ name: pdu, kind: pdu, capacityW: 69000, redundancy: N+N, minSources: 1, sources: "pdu-*", feeds: [A, B] }]
    capacityW: 69000
  cooling: { kind: air, loop: external }
  domains:
    - { kind: scale-up, technology: nvlink, members: "server-*/gpu-*", unit: server }
    - { kind: maintenance, members: "*", unit: server }
  provides: []
  isNot: ["NVSwitch chips on each HGX baseboard are not modelled as devices; scale-up is per server."]
  sources: [{ what: "8-GPU servers per rack", url: "https://docs.nvidia.com/dgx-superpod/reference-architecture-scalable-infrastructure-h100/latest/", date: 2026-10-18 }]
---
apiVersion: dc-twin/v1alpha1
kind: RackFormat
metadata: { name: generic/oam-8gpu, version: 0.1.0 }
spec:
  archetype: server-scale
  params:
    server:  { type: profile, class: server, default: amd/instinct-mi355x-platform, label: Server }
    servers: { type: int, default: 4, range: [1, 4], label: Servers }
    pdu:     { type: profile, class: pdu, default: generic/pdu-3ph-24 }
  slots:
    - { names: "pdu-{a,b}", profile: $pdu, side: zero-u }
    - { names: "mgmt-switch", profile: generic/mgmt-switch-1g }
    - { names: "server-{01..$servers}", profile: $server, accepts: { class: server } }
  layout:
    height: 48
    uNumbering: eia
    front: [{ slots: "mgmt-switch" }, { slots: "server-{01..04}" }]
    back: [management, scale-out, frontend, power]
  power:
    inputs: [{ name: pdu, kind: pdu, capacityW: 69000, redundancy: N+N, minSources: 1, sources: "pdu-*", feeds: [A, B] }]
    capacityW: 69000
  cooling: { kind: air, loop: external }
  fixedLinks: [{ template: generic/node-mesh }]
  domains: [{ kind: scale-up, technology: xgmi, members: "server-*/gpu-*", unit: server }]
  isNot: ["The Infinity Fabric mesh inside each OAM baseboard is state only."]
  sources: [{ what: "OAM 8-GPU platform", url: "https://www.amd.com/en/products/accelerators/instinct/mi350.html", date: 2026-10-18 }]
