apiVersion: dc-twin/v1alpha1
kind: RackFormat
metadata: { name: generic/cpu-rack, version: 0.1.0 }
spec:
  archetype: cpu
  params:
    server:  { type: profile, class: server, default: generic/server-2u, label: Server }
    servers: { type: int, default: 12, range: [1, 20], label: Servers }
    pdu:     { type: profile, class: pdu, default: generic/pdu-3ph-24 }
  slots:
    - { names: "pdu-{a,b}", profile: $pdu, side: zero-u }
    - { names: "mgmt-switch", profile: generic/mgmt-switch-1g }
    - { names: "server-{01..$servers}", profile: $server, accepts: { class: server } }
  layout:
    height: 48
    uNumbering: eia
    front: [{ slots: "mgmt-switch" }, { slots: "server-{01..20}" }]
    back: [management, frontend, power]
  power:
    inputs: [{ name: pdu, kind: pdu, capacityW: 34500, redundancy: N+N, minSources: 1, sources: "pdu-*", feeds: [A, B] }]
    capacityW: 34500
  cooling: { kind: air, loop: external }
  isNot: ["A control-plane rack archetype."]
  sources: [{ what: archetype, url: "https://www.dmtf.org/standards/redfish", date: 2026-10-18 }]
---
apiVersion: dc-twin/v1alpha1
kind: RackFormat
metadata: { name: generic/network-rack, version: 0.1.0 }
spec:
  archetype: network
  params:
    ufm:       { type: profile, class: appliance, default: "", label: Fabric manager appliance }
    ibRails:   { type: int, default: 0, range: [0, 8], label: InfiniBand rails }
    roceRails: { type: int, default: 0, range: [0, 8], label: RoCE rails }
    pdu:       { type: profile, class: pdu, default: generic/pdu-3ph-24 }
  slots:
    - { names: "pdu-{a,b}", profile: $pdu, side: zero-u }
    - { names: "mgmt-switch-{1..2}", profile: generic/mgmt-switch-1g }
    - { names: "ufm-1", profile: $ufm, when: 'params.ufm != ""' }
  layout:
    height: 48
    uNumbering: eia
    front: [{ slots: "mgmt-switch-{1..2}" }, { slots: "ufm-1" }]
    back: [management, frontend, scale-out, power]
    reserved: [{ u: 1, units: 40, for: fabric }]
  power:
    inputs: [{ name: pdu, kind: pdu, capacityW: 48000, redundancy: N+N, minSources: 1, sources: "pdu-*", feeds: [A, B] }]
    capacityW: 48000
  cooling: { kind: air, loop: external }
  isNot: ["Spines, aggregation and rail switches are generated by fabric templates into the reserved U."]
  sources: [{ what: archetype, url: "https://www.dmtf.org/standards/redfish", date: 2026-10-18 }]
