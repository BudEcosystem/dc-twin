apiVersion: dc-twin/v1alpha1
kind: DeviceProfile
metadata: { name: nvidia/ufm-appliance, version: 0.1.0 }
spec:
  class: appliance
  form: { mounting: rack, units: 1 }
  identity: { serialFormat: "MT{digits:7}{upper:3}", macOUI: "b8:3f:d2", manufacturer: "NVIDIA", model: "UFM Enterprise Appliance" }
  ports:
    - { name: mgmt0, kind: ethernet, speed: 1G, role: management }
    - { name: svc0, kind: ethernet, speed: 25G, role: service }
    - { name: ib0, kind: infiniband, speed: 400G, role: scale-out }
    - { name: "psu-{0..1}", kind: power-in, source: pdu }
  power: { standbyW: 20, idleW: 250, maxW: 500 }
  cooling: { kind: air }
  faults: [generic/power]
  fidelity: { model: {} }
  provides:
    - { capability: fabric/ufm-rest, at: [model] }
  isNot: ["UFM REST is the twin's adapter bound to the model's InfiniBand ports; no UFM or subnet manager runs."]
  sources: [{ what: "UFM REST calls NICo makes", url: "https://github.com/dsx-ai-factory/infra-controller/tree/main/crates/ib-fabric", date: 2026-10-18 }]
---
apiVersion: dc-twin/v1alpha1
kind: DeviceProfile
metadata: { name: nvidia/qm9700, version: 0.1.0 }
spec:
  class: switch
  form: { mounting: rack, units: 1 }
  identity: { serialFormat: "MT{digits:7}{upper:3}", macOUI: "b8:3f:d2", guidPrefix: "0xfc6a1c03", manufacturer: "NVIDIA", model: "Quantum-2 QM9700" }
  ports:
    - { name: "ib{1..64}", kind: infiniband, speed: 400G }
    - { name: mgmt0, kind: ethernet, speed: 1G, role: management }
    - { name: "psu-{0..1}", kind: power-in, source: pdu }
  power: { standbyW: 0, idleW: 600, maxW: 1700 }
  cooling: { kind: air }
  faults: [generic/power, generic/link]
  fidelity: { model: {} }
  provides: [{ capability: fabric/ufm-rest, at: [model], via: nvidia/ufm }]
  isNot: ["InfiniBand has no packet path; ports, GUIDs and partitions are model state behind UFM REST."]
  sources: [{ what: "64 NDR ports", url: "https://www.nvidia.com/en-us/networking/infiniband/qm9700/", date: 2026-10-18 }]
---
apiVersion: dc-twin/v1alpha1
kind: DeviceProfile
metadata: { name: nvidia/dgx-h100, version: 0.1.0 }
spec:
  class: server
  form: { mounting: rack, units: 8 }
  identity: { serialFormat: "1{digits:12}", macOUI: "3c:6d:66", manufacturer: "NVIDIA", model: "DGXH100" }
  components:
    - { name: cpu, kind: cpu, count: 2, model: "Intel Xeon Platinum 8480C" }
    - name: gpu
      kind: accelerator
      vendor: nvidia
      count: 8
      model: "NVIDIA H100 80GB HBM3"
      memoryMiB: 81559   # what NVML reports (Mokka's hardware capture)
      maxW: 700
      ports: [{ name: nvl, kind: scale-up, technology: nvlink, lanes: 18 }]
    - { name: cx7, kind: nic, count: 8, model: "ConnectX-7 400G" }
    - { name: psu, kind: psu, count: 6, model: "3300 W" }
    - { name: fan, kind: fan, count: 12, model: "fan module" }
    - { name: nvme, kind: drive, count: 8, model: "NVMe 3.84 TB" }
    - { name: tpm, kind: tpm, count: 1, model: "TPM 2.0" }
  bmc: { dialect: nvidia/dgx, ipmi: true }
  ports:
    - { name: bmc0, kind: ethernet, speed: 1G, role: management }
    - { name: "cx7-{0..7}", kind: infiniband, speed: 400G, role: scale-out }
    - { name: eth0, kind: ethernet, speed: 200G, role: provisioning }
    - { name: eth1, kind: ethernet, speed: 200G, role: frontend }
    - { name: "psu-{0..1}", kind: power-in, source: pdu }
  power: { standbyW: 80, idleW: 2500, maxW: 10200 }
  cooling: { kind: air }
  sensors:
    - { name: inlet, quantity: temperature, unit: C, warn: 35, crit: 45, source: inlet }
    - { name: gpu-max, quantity: temperature, unit: C, warn: 85, crit: 95, source: accelerator-max }
    - { name: power, quantity: power, unit: W, source: power }
  firmware:
    - { component: bmc, baseline: "24.09.10", applyOn: reset }
    - { component: bios, baseline: "1.06.02", applyOn: reset }
    - { component: cpld, baseline: "0.2.1.8", applyOn: reset }   # CPLDMB_0, as the captured DGX has it
  behaviours: { power: { onSeconds: 60, offSeconds: 15 }, bmc: { bootSeconds: 90 } }
  faults: [generic/power, generic/bmc, generic/thermal, generic/link, generic/firmware, nvidia/xid]
  fidelity: { model: {}, vm: { arch: x86_64, firmware: uefi, tpm: true, inHost: [nvidia/mokka], cost: { ramGB: 8, vcpu: 4 } } }
  kubernetes: { resources: { "nvidia.com/gpu": 8 } }
  metrics: { exporter: dcgm }
  provides:
    - { capability: "redfish/dialect:nvidia/dgx", at: [model, vm] }
    - { capability: ipmi/lan, at: [model] }
    - { capability: boot/walk, at: [model] }
  isNot: ["The Redfish tree is NICo's captured DGX H100 ('Viking') with identities scrubbed."]
  sources: [{ what: "Redfish tree", url: "https://github.com/dsx-ai-factory/libredfish/tree/a51ffb1ffeae15d8f9471224cb799d54007098a2/tests/mockups/nvidia_viking", date: 2026-10-18 }]
---
apiVersion: dc-twin/v1alpha1
kind: DeviceProfile
metadata: { name: nvidia/gh200-server, version: 0.1.0 }
spec:
  class: server
  form: { mounting: rack, units: 2 }
  identity: { serialFormat: "1{digits:12}", macOUI: "3c:6d:66", manufacturer: "NVIDIA", model: "GH200" }
  components:
    - { name: cpu, kind: cpu, count: 1, model: "NVIDIA Grace, 72 cores" }
    - { name: gpu, kind: accelerator, vendor: nvidia, count: 1, model: "NVIDIA GH200 480GB", memoryGiB: 96, maxW: 1000 }
    - { name: cx7, kind: nic, count: 1, model: "ConnectX-7 400G" }
    - { name: bf3, kind: dpu, count: 1, profile: nvidia/bluefield-3 }
    - { name: tpm, kind: tpm, count: 1, model: "TPM 2.0" }
  bmc: { dialect: nvidia/gh200-bmc, ipmi: true }
  ports:
    - { name: bmc0, kind: ethernet, speed: 1G, role: management }
    - { name: cx7-0, kind: infiniband, speed: 400G, role: scale-out }
    - { name: "psu-{0..1}", kind: power-in, source: pdu }
  power: { standbyW: 40, idleW: 600, maxW: 2000 }
  cooling: { kind: air }
  sensors:
    - { name: inlet, quantity: temperature, unit: C, warn: 35, crit: 45, source: inlet }
    - { name: gpu-max, quantity: temperature, unit: C, warn: 85, crit: 95, source: accelerator-max }
    - { name: power, quantity: power, unit: W, source: power }
  firmware: [{ component: bmc, baseline: "24.04.0", applyOn: reset }]
  behaviours: { power: { onSeconds: 40, offSeconds: 10 }, bmc: { bootSeconds: 90 } }
  faults: [generic/power, generic/bmc, generic/thermal, generic/link, generic/firmware, nvidia/xid]
  fidelity: { model: {} }
  kubernetes: { resources: { "nvidia.com/gpu": 1 } }
  metrics: { exporter: dcgm }
  provides:
    - { capability: "redfish/dialect:nvidia/gh200-bmc", at: [model] }
    - { capability: boot/walk, at: [model] }
  isNot: ["The Redfish tree is NICo's captured GH200 with identities scrubbed."]
  sources: [{ what: "Redfish tree", url: "https://github.com/dsx-ai-factory/libredfish/tree/a51ffb1ffeae15d8f9471224cb799d54007098a2/tests/mockups/nvidia_gh200", date: 2026-10-18 }]
