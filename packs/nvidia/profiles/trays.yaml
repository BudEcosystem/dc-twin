apiVersion: dc-twin/v1alpha1
kind: DeviceProfile
metadata: { name: nvidia/bluefield-3, version: 0.1.0 }
spec:
  class: dpu
  form: { mounting: none }
  identity: { serialFormat: "MT{digits:7}{upper:3}", macOUI: "b8:3f:d2", manufacturer: "https://www.mellanox.com", model: "BlueField-3 SmartNIC Main Card", partNumber: "900-9D3B6-00CV-AA0" }
  components:
    - { name: arm, kind: cpu, count: 1, model: "16 x Arm A78" }
    - { name: bmc, kind: bmc, count: 1, model: "BlueField BMC" }
  bmc: { dialect: nvidia/bluefield, console: ssh }
  ports:
    - { name: bmc0, kind: ethernet, speed: 1G, role: management }
    - { name: p0, kind: ethernet, speed: 200G, role: provisioning }
    - { name: p1, kind: ethernet, speed: 200G, role: frontend }
  power: { standbyW: 10, idleW: 60, maxW: 150 }
  cooling: { kind: liquid, loop: rack-manifold }
  firmware:
    # The BMC runs a pushed image after the BMC reboot its updater requests next (DPF: task
    # Completed, then Manager.Reset), which is where the engine applies a staged bmc component.
    - { component: bmc, baseline: "BF-24.10-10", applyOn: reset }
    - { component: nic, baseline: "32.43.1008", applyOn: reset }
    # The Arm's boot firmware (the BMC's DPU_UEFI, DPU_ATF and DPU_BSP), which a BFB's installer
    # writes as its ARM capsule and the Arm runs from its next reset. At vm the twin stages the
    # BFB's versions when the installer reports the capsule written (DPF checks them against the
    # BFB's before the DPU joins); nothing is flashed, and the Arm's machine keeps QEMU's edk2.
    - { component: uefi, baseline: "4.9.0-46-g7e3911bd4d", applyOn: reset }
    - { component: atf, baseline: "v2.2(release):4.9.0-25-g0ce57e322", applyOn: reset }
    - { component: bsp, baseline: "4.9.0.13378", applyOn: reset }
  behaviours: { power: { onSeconds: 30, offSeconds: 5 }, bmc: { bootSeconds: 60 } }
  faults: [generic/bmc, generic/link, nvidia/dpu]
  # At vm the BMC is still the model's, fronted by the bluefield adapter, and the Arm is a QEMU
  # machine that a pushed BFB installs and boots (the bluefield adapter's substrate, D52). Its DPU
  # OS runs in the cost below; the BFB's installer gets 8 GB whatever the cost, the least it
  # installs with (it unpacks its 1.6 GB initramfs into a RAM file system of half the memory, Q1).
  fidelity: { model: {}, vm: { arch: aarch64, firmware: uefi, cost: { ramGB: 4, vcpu: 4 } } }
  provides:
    - { capability: "redfish/dialect:nvidia/bluefield", at: [model, vm] }
    - { capability: "dpu/bmc:nvidia/bluefield", at: [model, vm] }
  isNot:
    model: ["No DPU OS or BFB runs at model; HBN and the DPU agent are absent (Q1)."]
    vm: ["The Arm is QEMU's virt machine: no ConnectX-7 ports, representors or SFs, no rshim or tmfifo, no boot FIFO, no IPMI towards the BMC, no eMMC (D52)."]
  sources: [{ what: "Redfish tree", url: "https://github.com/dsx-ai-factory/libredfish/tree/a51ffb1ffeae15d8f9471224cb799d54007098a2/tests/mockups/nvidia_dpu", date: 2026-10-18 }]
