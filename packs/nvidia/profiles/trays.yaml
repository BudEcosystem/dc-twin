apiVersion: dc-twin/v1alpha1
kind: DeviceProfile
metadata: { name: nvidia/gb300-compute-tray, version: 0.1.0 }
spec:
  class: compute-tray
  form: { mounting: tray, units: 1 }
  identity: { serialFormat: "1{digits:12}", macOUI: "3c:6d:66", manufacturer: "NVIDIA", model: "NVIDIA GB300", partNumber: "699-25859-0310-TS3" }
  components:
    - { name: cpu, kind: cpu, count: 2, model: "NVIDIA Grace, 72 cores" }
    - name: gpu
      kind: accelerator
      vendor: nvidia
      count: 4
      model: "NVIDIA GB300"   # the NVML name: dcgm-exporter's modelName and GFD's gpu.product derive from it
      memoryGiB: 288
      memoryMiB: 284208   # what NVML reports on a GB300 (Mokka's hardware capture)
      serialShare: 2      # a superchip's two GPUs carry one board serial
      maxW: 1400
      ports: [{ name: nvl, kind: scale-up, technology: nvlink, lanes: 18 }]
    - { name: cx8, kind: nic, count: 4, model: "ConnectX-8 800G" }
    - { name: bf3, kind: dpu, count: 1, profile: nvidia/bluefield-3 }
    - { name: nvme, kind: drive, count: 4, model: "NVMe 3.84 TB" }
    - { name: tpm, kind: tpm, count: 1, model: "TPM 2.0" }
    - { name: bmc, kind: bmc, count: 1, model: "NVIDIA BMC + HMC" }
  bmc: { dialect: nvidia/gb300-bmc, ipmi: true, console: sol }
  ports:
    - { name: bmc0, kind: ethernet, speed: 1G, role: management }
    - { name: "cx8-{0..3}", kind: infiniband, speed: 800G, role: scale-out }
    - { name: pwr-in, kind: power-in, source: busbar }
  power: { standbyW: 60, idleW: 1600, maxW: 7200, model: per-component }
  cooling: { kind: liquid, loop: rack-manifold }
  sensors:
    - { name: coolant-in, quantity: temperature, unit: C, warn: 45, crit: 55, source: coolant-in }
    - { name: gpu-max, quantity: temperature, unit: C, warn: 85, crit: 95, source: accelerator-max }
    - { name: cpu-max, quantity: temperature, unit: C, warn: 90, crit: 100, source: cpu-max }
    - { name: power, quantity: power, unit: W, source: power }
    - { name: leak, quantity: leak, source: tray-leak-detector }
  firmware:
    - { component: bmc, baseline: "25.09.12", applyOn: reset }
    - { component: uefi, baseline: "1.07.03", applyOn: reset }
    - { component: cpld, baseline: "0.3.1", applyOn: ac-cycle }
    - { component: gpu, baseline: "97.10.4A.00.01", applyOn: ac-cycle }
  behaviours:
    power: { onSeconds: 40, offSeconds: 10, requires: "rack.power.sourcesOn >= rack.power.minSources" }
    boot: { postSeconds: 120 }
    bmc: { bootSeconds: 90 }
  faults: [generic/power, generic/bmc, generic/thermal, generic/leak, generic/firmware, generic/link, nvidia/xid, nvidia/nvlink]
  fidelity:
    model: {}
    vm: { arch: aarch64, firmware: uefi, tpm: true, inHost: [nvidia/mokka], cost: { ramGB: 12, vcpu: 4 } }
  kubernetes:
    resources: { "nvidia.com/gpu": 4 }
    labels: { "nvidia.com/gpu.clique": "{domain}" }   # product, count, family, memory: derived from the gpu component
  metrics: { exporter: dcgm }
  provides:
    - { capability: "redfish/dialect:nvidia/gb-bmc", at: [model, vm] }
    - { capability: "redfish/dialect:nvidia/gb300-bmc", at: [model, vm] }
    - { capability: redfish/leak-detectors, at: [model, vm] }
    - { capability: redfish/event-service-sse, at: [model, vm] }
    - { capability: redfish/update-service, at: [model, vm] }
    - { capability: redfish/account-service, at: [model, vm] }
    - { capability: ipmi/lan, at: [model] }
    - { capability: boot/walk, at: [model] }
    - { capability: tpm2/measured-boot, at: [vm] }
    - { capability: accelerator/nvml, at: [vm], via: nvidia/mokka }
    - { capability: "kubernetes/nodes:kwok", at: [model], via: kwok }
  isNot:
    all: ["No NVLink data path: NVLink lanes carry state only.", "The HMC is projected through the BMC Redfish tree; it has no separate network presence.", "The Redfish tree is NICo's captured GB200 tray with GB300 identity overlays; no GB300 capture has been checked."]
    vm: ["Grace is QEMU aarch64; on an x86 host this profile is model-only (09).", "In os: stack mode the GPUs are PCI stubs with no driver behind them (D23)."]
  sources:
    - { what: "tray composition: 4 B300, 2 Grace, 4 ConnectX-8, 1 BlueField-3", url: "https://docs.nvidia.com/enterprise-reference-architectures/nvl72-ai-factory/latest/components.html", date: 2026-10-18 }
    - { what: "Redfish tree", url: "https://github.com/dsx-ai-factory/libredfish/tree/a51ffb1ffeae15d8f9471224cb799d54007098a2/tests/mockups/nvidia_gb200", date: 2026-10-18 }
