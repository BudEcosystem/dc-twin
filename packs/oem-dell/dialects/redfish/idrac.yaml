apiVersion: dc-twin/v1alpha1
kind: RedfishDialect
metadata: { name: oem-dell/idrac, version: 0.1.0 }
spec:
  backend: mockup
  mockup: libredfish/dell
  system: /redfish/v1/Systems/System.Embedded.1
  manager: /redfish/v1/Managers/iDRAC.Embedded.1
  chassis: /redfish/v1/Chassis/System.Embedded.1
  bmcInterface: /redfish/v1/Managers/iDRAC.Embedded.1/EthernetInterfaces/NIC.1
  bind: { serial: "/redfish/v1/Systems/System.Embedded.1#SerialNumber", uuid: "/redfish/v1/Systems/System.Embedded.1#UUID" }
  factory: { user: root }
  seedAccounts: true
  # option 60 as an iDRAC sends it (NICo's dhcp-common recognises "iDRAC" as an x86 Dell BMC)
  identity: { dhcpVendorClass: "iDRAC" }
  # iDRAC answers every Bios/Settings PATCH 202 with a JID_ job (the capture records one body's)
  settingsJobs: "/redfish/v1/TaskService/Tasks/JID_{n}"
  overlays:
    - { path: "/redfish/v1/Systems/System.Embedded.1", set: Model, from: model }
    - { path: "/redfish/v1/Systems/System.Embedded.1", set: Status.HealthRollup, from: health }
  isNot: ["Serves NICo's captured PowerEdge R750 iDRAC9 tree bound to the model; OEM job queues answer as captured."]
  sources: [{ what: "captured PowerEdge R750 iDRAC9", url: "https://github.com/dsx-ai-factory/libredfish/tree/a51ffb1ffeae15d8f9471224cb799d54007098a2/tests/mockups/dell", date: 2026-10-18 }]
---
apiVersion: dc-twin/v1alpha1
kind: RedfishDialect
metadata: { name: oem-dell/idrac-multi-dpu, version: 0.1.0 }
spec:
  inherits: oem-dell/idrac
  backend: mockup
  mockup: libredfish/dell_multi_dpu
  factory: { user: root }
  isNot: ["Serves NICo's captured R750-with-BlueField iDRAC tree bound to the model."]
