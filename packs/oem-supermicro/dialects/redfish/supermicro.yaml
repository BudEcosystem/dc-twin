apiVersion: dc-twin/v1alpha1
kind: RedfishDialect
metadata: { name: oem-supermicro/redfish, version: 0.1.0 }
spec:
  backend: mockup
  mockup: libredfish/supermicro
  system: /redfish/v1/Systems/1
  manager: /redfish/v1/Managers/1
  chassis: /redfish/v1/Chassis/1
  bmcInterface: /redfish/v1/Managers/1/EthernetInterfaces/1
  bind: { serial: "/redfish/v1/Systems/1#SerialNumber", uuid: "/redfish/v1/Systems/1#UUID" }
  factory: { user: root }
  seedAccounts: true
  overlays:
    - { path: "/redfish/v1/Systems/1", set: Model, from: model }
    - { path: "/redfish/v1/Systems/1", set: Status.HealthRollup, from: health }
  # the captured server carries a BlueField-2 (MBF2M516C) as its tenth adapter
  dpus:
    - /redfish/v1/Chassis/1/NetworkAdapters/10
    - /redfish/v1/Chassis/1/PCIeDevices/NIC10
    - /redfish/v1/UpdateService/FirmwareInventory/NIC10
    - /redfish/v1/Systems/1/EthernetInterfaces/11
  isNot: ["Serves NICo's captured SYS-821GE-TNHR tree bound to the model; OEM job queues answer as captured."]
  sources: [{ what: "captured SYS-821GE-TNHR", url: "https://github.com/dsx-ai-factory/libredfish/tree/a51ffb1ffeae15d8f9471224cb799d54007098a2/tests/mockups/supermicro", date: 2026-10-18 }]
