apiVersion: dc-twin/v1alpha1
kind: DeviceProfile
metadata: { name: oem-hpe/dl385-gen10p, version: 0.1.0 }
spec:
  class: server
  form: { mounting: rack, units: 2 }
  identity: { serialFormat: "MXQ{digits:6}{upper:1}", macOUI: "5c:ed:8c", manufacturer: "HPE", model: "ProLiant DL385 Gen10 Plus v2" }
  components:
    - { name: cpu, kind: cpu, count: 2, model: "AMD EPYC 7543" }
    - { name: nic, kind: nic, count: 2, model: "25GbE" }
    - { name: psu, kind: psu, count: 2, model: "1600 W" }
    - { name: tpm, kind: tpm, count: 1, model: "TPM 2.0" }
  bmc: { dialect: oem-hpe/ilo, ipmi: true }
  ports:
    - { name: bmc0, kind: ethernet, speed: 1G, role: management }
    - { name: eth0, kind: ethernet, speed: 25G, role: provisioning }
    - { name: eth1, kind: ethernet, speed: 25G, role: frontend }
    - { name: "psu-{0..1}", kind: power-in, source: pdu }
  power: { standbyW: 25, idleW: 200, maxW: 1000 }
  cooling: { kind: air }
  sensors:
    - { name: inlet, quantity: temperature, unit: C, warn: 35, crit: 45, source: inlet }
    - { name: power, quantity: power, unit: W, source: power }
  firmware: [{ component: bmc, baseline: "2.78", applyOn: reset }, { component: bios, baseline: "A42 v2.60 (08/11/2022)", applyOn: reset }]
  behaviours: { power: { onSeconds: 30, offSeconds: 10 }, bmc: { bootSeconds: 90 } }
  faults: [generic/power, generic/bmc, generic/thermal, generic/link, generic/firmware]
  fidelity: { model: {} }
  provides: [{ capability: "redfish/dialect:oem-hpe/ilo", at: [model] }, { capability: ipmi/lan, at: [model] }, { capability: boot/walk, at: [model] }]
  isNot: ["The iLO tree is the capture; HPE OEM links answer as captured."]
  sources: [{ what: "DL385 Gen10 Plus v2", url: "https://github.com/dsx-ai-factory/libredfish/tree/a51ffb1ffeae15d8f9471224cb799d54007098a2/tests/mockups/hpe", date: 2026-10-18 }]
